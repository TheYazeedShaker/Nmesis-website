<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{meta.title}}</title>
  <meta name="description" content="{{meta.description}}">
  <meta name="posthog-project-token" content="{{site.posthog.projectToken}}">
  <meta name="posthog-api-host" content="{{site.posthog.apiHost}}">
  <style>[data-feature-flag][hidden]{display:none!important}</style>
  <meta name="theme-color" content="{{site.colors.background}}">
  {{{meta.canonical}}}
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles/shared.css">
  <link rel="stylesheet" href="/styles/pages/{{meta.style}}.css">
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/interactions.css">
  <link rel="stylesheet" href="/styles/motion.css">
  <link rel="stylesheet" href="/styles/motion-initial.css">
  <script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches){document.documentElement.classList.add('motion-ready');setTimeout(()=>document.documentElement.classList.remove('motion-ready'),5000);}</script>
  <script src="/vendor/motion.js" defer></script>
  <script src="/vendor/lenis.js" defer></script>
  <script src="/scripts/motion-data.js" defer></script>
  <script src="/scripts/feature-flags.js" defer></script>
  <script src="/scripts/site.js" defer></script>
  <script src="/scripts/motion.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div id="main">
    <div class="design-sLQSv design-GnxxI design-1eh47ed" style="min-height:100vh;width:auto">
      {{{header}}}
      <main id="content" tabindex="-1">{{{content}}}</main>
      {{{cta}}}
      {{{footer}}}
    </div>
  </div>
  {{{icons}}}
  <dialog data-lenis-prevent class="mobile-menu" aria-label="Main navigation">
    <button class="menu-close" aria-label="Close navigation"><span aria-hidden="true"></span><span aria-hidden="true"></span></button>
    <nav>{{{mobileLinks}}}</nav>
    <div class="mobile-social"><a href="mailto:{{site.email}}">{{site.email}}</a></div>
  </dialog>
  <div class="form-notice" role="status" hidden></div>
</body>
</html>
